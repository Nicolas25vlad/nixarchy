name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Upstream Omarchy and Hyprland both move fast. A weekly run catches a
    # break before someone else's `nix flake update` does.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check formatting
        run: nix fmt -- --ci

      - name: statix
        run: nix run nixpkgs#statix -- check .

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail .

  omarchy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Cheap and the most informative single check: proves the vendored tree
      # assembles, shebangs patch, and the bin/ symlink farm is intact.
      - name: Build the vendored Omarchy tree
        run: nix build .#omarchy --print-build-logs

      - name: Verify the CLI sees its subcommands
        run: |
          # bin/omarchy discovers subcommands by grepping sibling scripts for
          # `# omarchy:summary=`. Wrapping the bins silently breaks this, and
          # the package still builds -- so assert on it rather than trust it.
          count=$(grep -l 'omarchy:summary=' result/share/omarchy/bin/* | wc -l)
          echo "commands with metadata: $count"
          test "$count" -gt 300

      - name: Verify no /bin/bash shebangs survived
        run: |
          # Executables only. Upstream ships two non-executable scripts
          # (omarchy-remove-service-{dropbox,tailscale}, mode 644), which
          # patchShebangs correctly skips and which cannot run on Arch either.
          # Matching upstream beats chmod-ing them to make a check pass.
          unpatched=$(find result/share/omarchy/bin/ -type f -perm -u+x \
            -exec grep -l '^#!/bin/bash' {} + || true)
          if [ -n "$unpatched" ]; then
            echo "::error::unpatched shebangs: $unpatched"
            exit 1
          fi
          echo "all executable scripts patched"

  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Free disk space
        # Hyprland + a full desktop closure does not fit in the default runner.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Add hyprland cache
        run: |
          echo "extra-substituters = https://hyprland.cachix.org" | sudo tee -a /etc/nix/nix.conf
          echo "extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIITemDosxrE9/Kb+PfYvE=" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon || true

      - name: Build the VM system closure
        run: nix build .#checks.x86_64-linux.vm-toplevel --print-build-logs
